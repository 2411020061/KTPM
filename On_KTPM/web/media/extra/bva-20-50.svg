<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title">
  <title id="title">BVA ba giá trị quanh biên dưới 20 và biên trên 50</title>
  <rect width="720" height="220" rx="14" fill="#ffffff"/>
  <text x="30" y="37" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#183153">Miền hợp lệ: 20 đến 50</text>
  <path d="M40 122h640" stroke="#94a3b8" stroke-width="5"/>
  <path d="M100 122h175M445 122h175" stroke="#3994d0" stroke-width="6"/>
  <g font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <circle cx="100" cy="122" r="23" fill="#c5453e"/><text x="100" y="129" fill="white">19</text>
    <circle cx="185" cy="122" r="23" fill="#16844a"/><text x="185" y="129" fill="white">20</text>
    <circle cx="270" cy="122" r="23" fill="#16844a"/><text x="270" y="129" fill="white">21</text>
    <circle cx="450" cy="122" r="23" fill="#16844a"/><text x="450" y="129" fill="white">49</text>
    <circle cx="535" cy="122" r="23" fill="#16844a"/><text x="535" y="129" fill="white">50</text>
    <circle cx="620" cy="122" r="23" fill="#c5453e"/><text x="620" y="129" fill="white">51</text>
  </g>
  <text x="182" y="190" font-family="Arial,sans-serif" font-size="15" fill="#334155">Quanh biên dưới</text>
  <text x="485" y="190" font-family="Arial,sans-serif" font-size="15" fill="#334155">Quanh biên trên</text>
</svg>
