<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title">
<title id="title">Các vùng không được chồng lấn</title>
<rect width="900" height="300" rx="14" fill="white"/>
<text x="24" y="38" fill="#183153" font-size="23" font-weight="700">Các vùng không được chồng lấn</text>
<g font-family="Arial,sans-serif"><rect x="24" y="62" width="284" height="78" fill="#fee2e2"/><text x="166" y="94" text-anchor="middle" fill="#b91c1c" font-size="19" font-weight="700">≤ 9</text><text x="166" y="122" text-anchor="middle" fill="#334155" font-size="15">vùng 1</text><rect x="308" y="62" width="284" height="78" fill="#dcfce7"/><text x="450" y="94" text-anchor="middle" fill="#15803d" font-size="19" font-weight="700">10–20</text><text x="450" y="122" text-anchor="middle" fill="#334155" font-size="15">vùng 2</text><rect x="592" y="62" width="284" height="78" fill="#fee2e2"/><text x="734" y="94" text-anchor="middle" fill="#b91c1c" font-size="19" font-weight="700">≥ 20</text><text x="734" y="122" text-anchor="middle" fill="#334155" font-size="15">vùng 3</text>
<path d="M24 62H876M24 140H876M24 259H876" stroke="#94a3b8" stroke-width="2"/>
<path d="M308 62V259M592 62V259" stroke="#ef4444" stroke-width="2"/>
<path d="M42 190H858" stroke="#475569" stroke-width="3"/>
<path d="M858 190l-12 -6v12z" fill="#475569"/><circle cx="238" cy="190" r="25" fill="#b91c1c"/><text x="238" y="198" text-anchor="middle" fill="white" font-size="19" font-weight="700">9</text><text x="238" y="239" text-anchor="middle" fill="#334155" font-size="13">chỉ vùng 1</text><circle cx="450" cy="190" r="25" fill="#15803d"/><text x="450" y="198" text-anchor="middle" fill="white" font-size="19" font-weight="700">15</text><text x="450" y="239" text-anchor="middle" fill="#334155" font-size="13">chỉ vùng 2</text><circle cx="592" cy="190" r="25" fill="#b91c1c"/><text x="592" y="198" text-anchor="middle" fill="white" font-size="19" font-weight="700">20</text><text x="592" y="239" text-anchor="middle" fill="#334155" font-size="13">trùng 2 vùng</text>
<text x="24" y="285" fill="#1e3a5f" font-size="15">Số 20 xuất hiện ở cả vùng 2 và vùng 3: phải sửa ranh giới.</text></g></svg>